# Regenera factsheets.json cada vez que cambia la carpeta /WEEKLY.
#
# Flujo de actualizacion mensual:
#   1. Subis los PDF nuevos a /WEEKLY (arrastrandolos en GitHub o con push)
#   2. Este workflow corre solo y actualiza factsheets.json
#   3. Vercel redeploya y los links de la calculadora apuntan al mes nuevo
#
# No hace falta tocar factsheets.json a mano nunca.

name: Indexar factsheets

on:
  push:
    paths:
      - 'WEEKLY/**'
      - 'scripts/index-factsheets.mjs'
      - '.github/workflows/index-factsheets.yml'
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  indexar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generar factsheets.json
        run: node scripts/index-factsheets.mjs

      - name: Commitear si cambió
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain factsheets.json)" ]]; then
            git add factsheets.json
            git commit -m "Actualizar índice de factsheets"
            git push
          else
            echo "Sin cambios en factsheets.json"
          fi
